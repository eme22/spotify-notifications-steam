name: CI

# The PluginDatabase release pipeline (scripts/build/prepare-dist.sh) does not build
# anything: it only copies files that are already committed. It hard-fails with
# `exit 1` when .millennium/ is missing, and it copies backend/ verbatim, so a missing
# or stale backend/mediadaemon.exe ships a broken plugin.
#
# Because of that, the two build artifacts are committed to the repository. This workflow
# is the guard that keeps them in sync with their sources: if a source change is pushed
# without rebuilding, the job fails instead of letting a stale artifact reach users.
#
# It also produces release.zip and, whenever plugin.json points at a version that has no
# GitHub release yet, publishes that zip under the tag v<version>. Bumping the version in
# plugin.json is therefore all it takes to ship a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-artifacts:
    name: Verify committed build artifacts are up to date
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # pnpm 11 needs Node >= 22.13.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild daemon and frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location mediadaemon-rust
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          Pop-Location
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed" }

      # The committed artifacts cannot be compared byte-for-byte against a rebuild:
      # the Rust binary embeds absolute build paths (CARGO_HOME, workspace dir) and the
      # JS bundle depends on the bundler's Node version, so two machines always differ.
      # What actually matters is that nobody changes the sources without refreshing the
      # artifacts in the same change set, so check the co-change instead.
      - name: Verify committed artifacts were refreshed with their sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ((git log -1 --format=%B HEAD) -match "\[skip-artifact-check\]") {
            Write-Host "Skipping the artifact check: [skip-artifact-check] is in the head commit."
            exit 0
          }

          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
            $head = "${{ github.event.pull_request.head.sha }}"
          } else {
            $base = "${{ github.event.before }}"
            $head = "${{ github.sha }}"
          }

          # New branches, manual runs and shallow checkouts may not have those commits.
          git rev-parse --verify --quiet "$base^{commit}" *> $null
          if ($LASTEXITCODE -ne 0) {
            $base = "HEAD^1"
            $head = "HEAD"
            git rev-parse --verify --quiet "$base^{commit}" *> $null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "No parent commit to compare against; skipping the artifact check."
              exit 0
            }
          }

          $changed = @(git diff --name-only $base $head)

          # Only dependency changes affect the bundle; a version bump does not.
          # Type-only packages are stripped at build time, so ignore them too.
          function Get-DependencySnapshot([string]$rev) {
            $raw = git show "${rev}:package.json" 2>$null
            if ($LASTEXITCODE -ne 0) { return "" }
            $pkg = $raw | ConvertFrom-Json
            $lines = foreach ($section in @("dependencies", "devDependencies")) {
              $deps = $pkg.$section
              if ($null -eq $deps) { continue }
              foreach ($prop in $deps.PSObject.Properties) {
                if ($prop.Name -like "@types/*") { continue }
                "$section/$($prop.Name)=$($prop.Value)"
              }
            }
            return ((@($lines) | Sort-Object) -join "`n")
          }

          $bundleInputs = @($changed | Where-Object { $_ -like "frontend/*" })
          if ((Get-DependencySnapshot $base) -ne (Get-DependencySnapshot $head)) {
            $bundleInputs += "package.json dependencies"
          }
          $daemonInputs = @($changed | Where-Object { $_ -like "mediadaemon-rust/*" })

          $stale = @()
          if ($bundleInputs.Count -gt 0 -and $changed -notcontains ".millennium/Dist/index.js") {
            $stale += "frontend sources or dependencies changed, but .millennium/Dist/index.js did not"
          }
          if ($daemonInputs.Count -gt 0 -and $changed -notcontains "backend/mediadaemon.exe") {
            $stale += "mediadaemon-rust changed, but backend/mediadaemon.exe did not"
          }

          if ($stale.Count -gt 0) {
            Write-Host "::error::Committed build artifacts are out of date."
            $stale | ForEach-Object { Write-Host "  - $_" }
            Write-Host ""
            Write-Host "Rebuild and commit the artifacts with the change:"
            Write-Host "  pnpm build                                        # refreshes .millennium/"
            Write-Host "  cargo build --release --manifest-path mediadaemon-rust/Cargo.toml"
            Write-Host "  copy mediadaemon-rust/target/release/mediadaemon.exe backend/"
            Write-Host ""
            Write-Host "Add [skip-artifact-check] to the commit message if the rebuild is a no-op."
            exit 1
          }

          Write-Host "Committed artifacts were refreshed alongside their sources."

      - name: Check Rust lints
        working-directory: mediadaemon-rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Package release.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Ship the daemon CI just built, not whatever version is committed.
          Copy-Item "mediadaemon-rust/target/release/mediadaemon.exe" "backend/mediadaemon.exe" -Force
          ./package-release.ps1

      - name: Upload release.zip
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release.zip when the plugin version changes
    needs: verify-artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "plugin.json has no version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Bumping plugin.json to a version that is already released (or pushing an existing
      # tag) must not republish, so ask GitHub before doing anything.
      - name: Check whether v${{ steps.version.outputs.version }} is already released
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "v${{ steps.version.outputs.version }} already exists; nothing to publish."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Download release.zip
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/release.zip
          generate_release_notes: true
